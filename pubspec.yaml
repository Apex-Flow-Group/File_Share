  shared_preferences: ^2.5.3
  url_launcher: ^6.2.0
  qr_flutter: ^4.1.0
  local_notifier: ^0.1.6
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0
