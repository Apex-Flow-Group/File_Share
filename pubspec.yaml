publish_to: 'none'
version: 2.0.3+2008

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bonsoir: ^6.0.3
  device_info_plus: ^10.0.0
  file_picker: ^8.1.4
  intl: ^0.20.2
  nearby_connections: ^4.3.0
  open_filex: ^4.5.0
